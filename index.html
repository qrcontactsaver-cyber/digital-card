<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiCard | Member Access</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-gray: #333333;
            --input-bg: #111111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid var(--accent-gray);
        }

        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: 2px; }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 20px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .btn-outline:hover { background: white; color: black; }

        /* --- Auth Screen (Login) --- */
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            flex-direction: column;
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border: 1px solid var(--accent-gray);
            background: var(--input-bg);
            text-align: center;
        }

        .auth-box h2 { font-family: 'Playfair Display', serif; margin-bottom: 20px; }
        
        .auth-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: black;
            border: 1px solid var(--accent-gray);
            color: white;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .toggle-text { font-size: 0.8rem; color: #888; cursor: pointer; text-decoration: underline; }

        /* --- App Screen (Hidden by default) --- */
        #app-container { display: none; } /* Hidden until logged in */

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        /* --- Form --- */
        .form-section { background: var(--input-bg); padding: 30px; border: 1px solid var(--accent-gray); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; color: #888; }
        
        input.app-input {
            width: 100%; padding: 12px; background: black;
            border: 1px solid var(--accent-gray); color: white;
            font-family: 'Inter', sans-serif;
        }
        input:focus { outline: none; border-color: white; }

        /* --- Preview --- */
        .qr-display {
            display: flex; justify-content: center; align-items: center;
            background: white; padding: 20px; width: 200px; height: 200px;
            margin: 0 auto; border-radius: 4px;
        }

        .actions h3 { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px;}

        .download-btn {
            display: flex; justify-content: space-between; width: 100%;
            padding: 15px; margin-bottom: 10px; background: #222;
            color: white; border: 1px solid #444; cursor: pointer;
            text-align: left; transition: 0.2s;
        }
        .download-btn:hover { background: #333; border-color: white; }
        
        #qr-code-hidden { display: none; }
        
        /* Loading Overlay */
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="loading">Loading...</div>

    <header>  
        <div class="logo">DIGICARD</div>
        <div id="user-info" style="display:none; align-items: center; gap: 15px;">
            <span id="user-email" style="font-size: 0.8rem; color: #888;"></span>
            <button class="btn-outline" onclick="logout()">Log Out</button>
        </div>
    </header>

    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Member Login</h2>
            <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
            <input type="password" id="auth-password" class="auth-input" placeholder="Password">
            
            <button class="auth-btn" onclick="handleAuth()">PROCEED</button>
            
            <p class="toggle-text" onclick="toggleAuthMode()" id="auth-toggle">
                New here? Create an account
            </p>
            <p id="auth-error" style="color: red; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="app-container">
        <div class="container">
            <div class="form-section">
                <h2 style="margin-bottom: 20px;">Your Details</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="app-input" id="fullName" oninput="updateQR()">
                </div>
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" class="app-input" id="jobTitle" oninput="updateQR()">
                </div>
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" class="app-input" id="company" oninput="updateQR()">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="app-input" id="phone" oninput="updateQR()">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="app-input" id="email" oninput="updateQR()">
                </div>
                <div class="form-group">
                    <label>Website</label>
                    <input type="text" class="app-input" id="website" oninput="updateQR()">
                </div>
                <p style="font-size: 0.7rem; color: #666; margin-top: 10px;">* Changes are saved automatically to your account.</p>
            </div>

            <div class="preview-section">
                <div class="qr-display" id="qr-display-container"></div>
                <div id="qr-code-hidden"></div>
                
                <div class="actions">
                    <h3>Export</h3>
                    <button class="download-btn" onclick="generatePDF('basic')">
                        <strong>Basic Card</strong><span>Minimal White</span>
                    </button>
                    <button class="download-btn" onclick="generatePDF('premium-landscape')">
                        <strong>Premium Landscape</strong><span>Bold Black</span>
                    </button>
                    <button class="download-btn" onclick="generatePDF('premium-vertical')">
                        <strong>Premium Vertical</strong><span>Modern Portrait</span>
                    </button>
                    <button class="download-btn" onclick="downloadVCard()">
                        <strong>Download .VCF</strong><span>Add to Contacts</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // 1. FIREBASE CONFIGURATION  
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDt8zeELhb2Fi7pF9gDs8NPi3H67gCUN98",
            authDomain: "qrve-3c04d.firebaseapp.com",
            projectId: "qrve-3c04d",
            storageBucket: "qrve-3c04d.firebasestorage.app",
            messagingSenderId: "333220774388",
            appId: "1:333220774388:web:776dd3e0108c993a4239a1",
            measurementId: "G-3VRZLY4RF9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ---------------------------------------------------------
        // 2. AUTHENTICATION LOGIC
        // ---------------------------------------------------------
        let isLoginMode = true;

        auth.onAuthStateChanged((user) => {
            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');
            const userInfo = document.getElementById('user-info');
            const userEmailDisplay = document.getElementById('user-email');

            if (user) {
                authContainer.style.display = 'none';
                appContainer.style.display = 'block';
                userInfo.style.display = 'flex';
                userEmailDisplay.textContent = user.email;
                loadUserData(user.uid);
            } else {
                authContainer.style.display = 'flex';
                appContainer.style.display = 'none';
                userInfo.style.display = 'none';
            }
        });

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Member Login' : 'Create Account';
            document.getElementById('auth-toggle').innerText = isLoginMode ? 'New here? Create an account' : 'Have an account? Log In';
            document.querySelector('.auth-btn').innerText = isLoginMode ? 'PROCEED' : 'SIGN UP';
            document.getElementById('auth-error').innerText = '';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const errorMsg = document.getElementById('auth-error');

            if(!email || !pass) {
                errorMsg.innerText = "Please fill in all fields";
                return;
            }

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                }
            } catch (error) {
                errorMsg.innerText = error.message;
            }
        }

        function logout() {
            auth.signOut();
            document.querySelectorAll('.app-input').forEach(input => input.value = '');
            generateQR();
        }

        // ---------------------------------------------------------
        // 3. DATABASE LOGIC
        // ---------------------------------------------------------
        async function loadUserData(userId) {
            document.getElementById('loading').style.display = 'flex';
            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('fullName').value = data.fullName || '';
                    document.getElementById('jobTitle').value = data.jobTitle || '';
                    document.getElementById('company').value = data.company || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('website').value = data.website || '';
                }
            } catch (error) { console.error("Error loading data", error); }
            document.getElementById('loading').style.display = 'none';
            generateQR();
        }

        function saveUserData() {
            const user = auth.currentUser;
            if (!user) return;
            const data = {
                fullName: document.getElementById('fullName').value,
                jobTitle: document.getElementById('jobTitle').value,
                company: document.getElementById('company').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                website: document.getElementById('website').value,
            };
            db.collection('users').doc(user.uid).set(data, { merge: true });
        }

        // ---------------------------------------------------------
        // 4. QR & GENERATION LOGIC
        // ---------------------------------------------------------
        let debounceTimer;

        function updateQR() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                generateQR();
                saveUserData();
            }, 800);
        }

        function getVCardData() {
            // Get raw input
            const rawName = document.getElementById('fullName').value || "Your Name";
            
            // --- SMART NAME SPLITTER ---
            const parts = rawName.trim().split(" ");
            let lastName = "";
            let firstName = "";

            if (parts.length > 1) {
                // Take the last word as surname
                lastName = parts.pop(); 
                // Join the rest as first name
                firstName = parts.join(" "); 
            } else {
                firstName = rawName;
            }

            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const org = document.getElementById('company').value;
            const title = document.getElementById('jobTitle').value;
            const site = document.getElementById('website').value;

            let vCard = `BEGIN:VCARD\nVERSION:3.0\n`;
            
            // Separate Name Field for contacts app
            vCard += `N:${lastName};${firstName};;;\n`;
            // Full Name for display
            vCard += `FN:${rawName}\n`;
            
            if(org) vCard += `ORG:${org}\n`;
            if(title) vCard += `TITLE:${title}\n`;
            if(phone) vCard += `TEL;TYPE=CELL:${phone}\n`;
            if(email) vCard += `EMAIL:${email}\n`;
            if(site) vCard += `URL:${site}\n`;
            vCard += `END:VCARD`;
            
            return vCard;
        }

        function generateQR() {
            const data = getVCardData();
            const displayContainer = document.getElementById("qr-display-container");
            const hiddenContainer = document.getElementById("qr-code-hidden");
            
            displayContainer.innerHTML = "";
            hiddenContainer.innerHTML = "";

            try {
                new QRCode(displayContainer, {
                    text: data, width: 160, height: 160,
                    colorDark : "#000000", colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.L
                });
                new QRCode(hiddenContainer, {
                    text: data, width: 500, height: 500,
                    colorDark : "#000000", colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.L
                });
            } catch (e) { console.error(e); }
        }

        function getQRDataURL() {
            const hiddenDiv = document.getElementById("qr-code-hidden");
            const img = hiddenDiv.querySelector("img");
            if (img && img.src) return img.src;
            const canvas = hiddenDiv.querySelector("canvas");
            if (canvas) return canvas.toDataURL("image/png");
            return null;
        }

        function downloadVCard() {
            const element = document.createElement("a");
            const file = new Blob([getVCardData()], {type: 'text/vcard'});
            element.href = URL.createObjectURL(file);
            element.download = "contact.vcf";
            document.body.appendChild(element);
            element.click();
        }

        // --- PDF HELPERS ---

        function drawIcon(doc, type, x, y, size) {
            doc.setLineWidth(0.01);
            if (type === 'phone') {
                doc.roundedRect(x, y, size * 0.6, size, size * 0.1, size * 0.1, 'S');
                doc.line(x, y + size * 0.2, x + size * 0.6, y + size * 0.2);
                doc.line(x, y + size * 0.8, x + size * 0.6, y + size * 0.8);
            } else if (type === 'email') {
                doc.rect(x, y + size * 0.2, size, size * 0.6, 'S');
                doc.line(x, y + size * 0.2, x + size / 2, y + size * 0.5);
                doc.line(x + size, y + size * 0.2, x + size / 2, y + size * 0.5);
            } else if (type === 'website') {
                // UPDATED: Browser Window Icon
                // Main window body
                doc.rect(x, y + size * 0.1, size, size * 0.7, 'S');
                // Title bar line
                doc.line(x, y + size * 0.3, x + size, y + size * 0.3);
                // Little "buttons" in the title bar
                const buttonSize = size * 0.06;
                doc.circle(x + size*0.15, y + size*0.2, buttonSize, 'F'); // Filled dot 1
                doc.circle(x + size*0.35, y + size*0.2, buttonSize, 'F'); // Filled dot 2
            }
        }

        async function generatePDF(type) {
            const { jsPDF } = window.jspdf;
            const qrImg = getQRDataURL();
            if (!qrImg) { alert("Please wait for QR generation."); return; }

            const doc = new jsPDF({
                orientation: type === 'premium-vertical' ? 'p' : 'l',
                unit: 'in', format: [3.5, 2]
            });

            const name = document.getElementById('fullName').value || "Your Name";
            const title = document.getElementById('jobTitle').value || "JOB TITLE";
            const company = document.getElementById('company').value || "Company Name";
            const phone = document.getElementById('phone').value || "Phone";
            const email = document.getElementById('email').value || "Email";
            const website = document.getElementById('website').value || "Website";

            if (type === 'basic') {
                // --- Basic Layout ---
                doc.setFont("helvetica", "bold"); doc.setFontSize(14); 
                doc.text(name, 0.2, 0.5);
                
                // Job Title
                doc.setFont("helvetica", "normal"); doc.setFontSize(8); 
                doc.setTextColor(100, 100, 100);
                const titleLines = doc.splitTextToSize(title.toUpperCase(), 1.8);
                doc.text(titleLines, 0.2, 0.7);
                
                let currentY = 0.7 + (titleLines.length * 0.15); 

                // Company (SMALLER FONT: 8pt)
                doc.setFont("helvetica", "bold"); doc.setFontSize(8);
                doc.setTextColor(0, 0, 0); 
                const companyLines = doc.splitTextToSize(company, 1.8);
                doc.text(companyLines, 0.2, currentY); 

                currentY += (companyLines.length * 0.12) + 0.1; 

                doc.setFont("helvetica", "normal"); doc.setFontSize(7);
                doc.setDrawColor(0);
                
                if(phone) { drawIcon(doc, 'phone', 0.2, currentY, 0.1); doc.text(phone, 0.35, currentY + 0.08); currentY += 0.15; }
                if(email) { drawIcon(doc, 'email', 0.2, currentY, 0.1); doc.text(email, 0.35, currentY + 0.08); currentY += 0.15; }
                if(website) { drawIcon(doc, 'website', 0.2, currentY, 0.1); doc.text(website, 0.35, currentY + 0.08); }
                
                doc.addImage(qrImg, 'PNG', 2.3, 0.25, 1.0, 1.0);
                doc.setFontSize(6); doc.text("SCAN TO SAVE", 2.45, 1.4);

            } else if (type === 'premium-landscape') {
                // --- Premium Landscape (WIDE DESIGN) ---
                doc.setFillColor(0, 0, 0); 
                doc.rect(0, 0, 3.5, 2, 'F'); 
                
                // --- TOP SECTION ---
                const maxWidth = 2.1; 
                let currentY = 0.5;

                doc.setTextColor(255, 255, 255);
                doc.setFont("times", "bold"); doc.setFontSize(16); 
                const nameLines = doc.splitTextToSize(name, maxWidth);
                doc.text(nameLines, 0.2, currentY);
                currentY += (nameLines.length * 0.25);

                doc.setFont("helvetica", "normal"); doc.setTextColor(200, 200, 200); 
                doc.setFontSize(8); 
                const titleLines = doc.splitTextToSize(title.toUpperCase(), maxWidth);
                doc.text(titleLines, 0.2, currentY);
                currentY += (titleLines.length * 0.12) + 0.25;

                // --- COMPANY (SMALLER FONT: 8pt) ---
                doc.setFont("times", "bold"); 
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(8); 
                const companyLines = doc.splitTextToSize(company, maxWidth);
                doc.text(companyLines, 0.2, currentY);
                currentY += (companyLines.length * 0.12) + 0.1;

                // --- BOTTOM SECTION ---
                doc.setFont("helvetica", "normal"); doc.setTextColor(200, 200, 200);
                doc.setFontSize(7); 
                doc.setDrawColor(200, 200, 200); 

                if(currentY > 1.6) currentY = 1.6;

                if(phone) { drawIcon(doc, 'phone', 0.2, currentY, 0.1); doc.text(phone, 0.35, currentY + 0.08); currentY += 0.15; }
                if(email) { drawIcon(doc, 'email', 0.2, currentY, 0.1); doc.text(email, 0.35, currentY + 0.08); currentY += 0.15; }
                if(website) { drawIcon(doc, 'website', 0.2, currentY, 0.1); doc.text(website, 0.35, currentY + 0.08); }
                
                doc.setFillColor(255, 255, 255); 
                doc.rect(2.4, 0.5, 0.9, 0.9, 'F'); 
                doc.addImage(qrImg, 'PNG', 2.45, 0.55, 0.8, 0.8);

            } else if (type === 'premium-vertical') {
                // --- Premium Vertical ---
                doc.setFillColor(15, 15, 15); doc.rect(0, 0, 2, 3.5, 'F'); 
                
                doc.setTextColor(255, 255, 255);
                doc.setFont("times", "bold"); doc.setFontSize(14); 
                doc.text(name, 1, 0.7, { align: "center" });
                
                doc.setFont("helvetica", "normal"); doc.setFontSize(7); 
                doc.setTextColor(180, 180, 180); 
                const titleLines = doc.splitTextToSize(title.toUpperCase(), 1.8);
                doc.text(titleLines, 1, 0.9, { align: "center" });

                let currentY = 0.9 + (titleLines.length * 0.15);

                // Company (SMALLER FONT: 8pt)
                doc.setFont("times", "bold"); doc.setFontSize(8);
                doc.setTextColor(255, 255, 255);
                const companyLines = doc.splitTextToSize(company, 1.8);
                doc.text(companyLines, 1, currentY, { align: "center" });

                doc.setFillColor(255, 255, 255); 
                doc.rect(0.5, 1.4, 1.0, 1.0, 'F');
                doc.addImage(qrImg, 'PNG', 0.55, 1.45, 0.9, 0.9);
                
                doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(255, 255, 255); doc.setDrawColor(255, 255, 255); 

                currentY = 2.8;
                const iconX = 0.4; const textX = 0.55;

                if(phone) { drawIcon(doc, 'phone', iconX, currentY, 0.08); doc.text(phone, textX, currentY + 0.06); currentY += 0.15; }
                if(email) { drawIcon(doc, 'email', iconX, currentY, 0.08); doc.text(email, textX, currentY + 0.06); currentY += 0.15; }
                if(website) { drawIcon(doc, 'website', iconX, currentY, 0.08); doc.text(website, textX, currentY + 0.06); }
            }
            doc.save(`${name.replace(/\s+/g, '_')}_BusinessCard.pdf`);
        }
    </script>
</body>
</html>
